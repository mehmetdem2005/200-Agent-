name: RigForge Android APK

on:
  push:
    branches:
      - main
      - agent/mobile-rig-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat archive/part*.b64 | base64 --decode > RigForgeMobile-source.zip
          echo "7831d0da61c73f008d169d2e073f51378d197e07952e5cd812a5f41a2c1a7efb  RigForgeMobile-source.zip" | sha256sum --check -
          unzip -q RigForgeMobile-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check architecture boundaries
        working-directory: MobileRig
        run: ./scripts/architecture_check.sh

      - name: Test native core
        working-directory: MobileRig
        run: ./scripts/native_core_test.sh

      - name: Build debug APK and run JVM tests
        working-directory: MobileRig
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RigForge-build-log
          path: MobileRig/build-output.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RigForge-debug-apk
          path: MobileRig/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
